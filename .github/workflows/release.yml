name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - name: Run tests
        run: go test ./...

  build:
    name: Build Linux ${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true
      - name: Build release archive
        env:
          VERSION: ${{ github.ref_name }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          archive="open-tunnelbroker_${VERSION}_linux_${GOARCH}.tar.gz"
          mkdir -p dist/package
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH" go build -trimpath \
            -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/package/open-tunnelbroker ./cmd/open-tunnelbroker
          cp LICENSE README.md dist/package/
          tar -C dist/package -czf "dist/$archive" open-tunnelbroker LICENSE README.md
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
