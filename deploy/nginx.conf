server {
    listen 443 ssl http2;
    server_name tunnelbroker.example.com;

    ssl_certificate /etc/letsencrypt/live/tunnelbroker.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tunnelbroker.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
