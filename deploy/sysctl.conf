# Required to route downstream tunnel traffic. Source validation is disabled on
# the WireGuard/upstream path because routed tunnel sources are expected.
net.ipv6.conf.all.forwarding=1
net.ipv4.ip_forward=1
net.ipv4.conf.all.rp_filter=0

# Needed only for on-link prefix delegation, where the provider resolves every
# address in the delegated prefix with Neighbor Discovery on the upstream
# segment. The daemon also enables this on the egress interface of every on-link
# upstream at apply time; setting it here keeps the behavior after a reboot even
# before the first reconciliation. It has no effect on routed delegation.
net.ipv6.conf.all.proxy_ndp=1
